# Hetzner multi-site: this app listens on host 127.0.0.1:5001
# Caddy (host) routes enuygun.pet -> 127.0.0.1:5001
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      SESSION_SECRET: ${SESSION_SECRET:-}
      SOCIAL_POST_SECRET: ${SOCIAL_POST_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-}
