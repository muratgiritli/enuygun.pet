server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    charset utf-8;

    error_page 404 /404.html;

    # Consolidate legacy indexed e-commerce paths cleanly via 301 to homepage
    location ~* ^/(?:urun|urunler|kategori|kategoriler|marka|markalar|kampanya|kampanyalar|hakkimizda|iletisim|teslimat|teslimat-bolgeleri|sss|sepet|hesabim|gizlilik-politikasi|mesafeli-satis-sozlesmesi)(?:/.*)?$ {
        return 301 https://www.enuygunpetshop.com/;
    }

    location = /manifest.json {
        return 301 https://www.enuygunpetshop.com/site.webmanifest;
    }

    if ($request_uri ~ ^/index\.html$) {
        return 301 https://www.enuygunpetshop.com/;
    }

    # Yandex & Search Engine Verification HTML files (serve directly, no redirect)
    location ~* ^/yandex_[a-zA-Z0-9_]+\.html$ {
        types { }
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* ^/[a-f0-9]+\.html$ {
        types { }
        default_type "text/html; charset=utf-8";
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Redirect /slug.html -> /slug (prevent duplicate URLs; keep 404.html, yandex_*, and hex verification files excluded)
    if ($request_uri ~ "^/(?!404\.html$|yandex_|[a-f0-9]+\.html$)([a-z0-9-]+)\.html$") {
        return 301 https://www.enuygunpetshop.com/$1;
    }

    # Redirect trailing slash /slug/ -> /slug (except root /)
    if ($request_uri ~ ^/([a-z0-9-]+)/$) {
        return 301 https://www.enuygunpetshop.com/$1;
    }

    location = /404 {
        return 404;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(?:webp|png|jpg|jpeg|ico|svg)$ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        types { }
        default_type "application/manifest+json; charset=utf-8";
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(?:sitemap_index\.xml|sitemaps\.xml|sitemap-index\.xml)$ {
        return 301 https://www.enuygunpetshop.com/sitemap.xml;
    }

    location = /sitemap.xml {
        types { }
        default_type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /sitemap.xsl {
        types { }
        default_type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(?:robots\.txt|llms\.txt|llms-full\.txt)$ {
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri.html $uri/ =404;
    }
}
